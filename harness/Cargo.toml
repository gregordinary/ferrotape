[package]
name = "ferrotape-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Test tooling for ferrotape: the case catalog, and the reference readers as its oracle"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
ferrotape = { path = ".." }

[[bin]]
name = "harness"
path = "src/main.rs"
