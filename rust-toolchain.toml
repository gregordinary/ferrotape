[toolchain]
# Pin the toolchain so formatting, linting, and builds are reproducible across
# machines and CI. rustfmt output varies between rustfmt releases, so a floating
# toolchain lets the same source format differently on different hosts; pinning
# removes that variance. Bump it deliberately, reformatting in the same commit.
#
# This pin is a contributor convenience and sits ahead of the crate's minimum
# supported Rust version, which is `rust-version` in Cargo.toml.
channel = "1.100.0"
components = ["rustfmt", "clippy"]
# Targets the library is built for to show that it uses nothing particular to
# Unix: WebAssembly with no operating system beneath it, and Windows; and one
# with no standard library, which the library builds for without its `std`
# feature.
targets = ["wasm32-unknown-unknown", "x86_64-pc-windows-msvc", "thumbv7em-none-eabihf"]
